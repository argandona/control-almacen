<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Portal Consumos — Encossa{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: .5px; }
    .card { border: none; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
    .table th { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: #6c757d; }
  </style>
</head>
<body>

{% if usuario %}
<nav class="navbar navbar-dark" style="background:#1d6a3a">
  <div class="container-fluid">
    <span class="navbar-brand"><i class="bi bi-box-seam me-2"></i>Encossa · Portal Consumos</span>
    <div class="d-flex align-items-center gap-3">
      <span class="text-white-50 small">{{ usuario.nombre }}</span>
      <a href="{% url 'portal_logout' %}" class="btn btn-sm btn-outline-light">
        <i class="bi bi-box-arrow-right me-1"></i>Salir
      </a>
    </div>
  </div>
</nav>
{% endif %}

<div class="container py-4">
  {% for message in messages %}
  <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
    {{ message }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endfor %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
