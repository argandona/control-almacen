<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — Portal Consumos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #1d6a3a 0%, #155724 100%); min-height: 100vh; display:flex; align-items:center; }
    .card { border: none; box-shadow: 0 8px 32px rgba(0,0,0,.18); }
    .logo-circle { width:72px; height:72px; background:#1d6a3a; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-6 col-lg-4">

      <div class="card p-4 p-md-5">
        <div class="logo-circle">
          <i class="bi bi-box-seam text-white" style="font-size:2rem"></i>
        </div>
        <h4 class="text-center fw-bold mb-1">Portal Consumos</h4>
        <p class="text-center text-muted small mb-4">Encossa Control de Almacén</p>

        {% for message in messages %}
        <div class="alert alert-danger py-2 small">
          <i class="bi bi-exclamation-triangle me-1"></i>{{ message }}
        </div>
        {% endfor %}

        <form method="post" autocomplete="off">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Correo electrónico</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" class="form-control" placeholder="usuario@empresa.com"
                     required autofocus>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" name="clave" id="clave" class="form-control" placeholder="••••••••" required>
              <button class="btn btn-outline-secondary" type="button"
                      onclick="var f=document.getElementById('clave');f.type=f.type==='password'?'text':'password'">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn w-100 text-white fw-semibold" style="background:#1d6a3a">
            <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
          </button>
        </form>
      </div>

      <p class="text-center text-white-50 small mt-3">
        Solo acceso para Liquidadores y Encargados de Almacén
      </p>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
